name: Protected-main ancestry qualification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed develop and preserve every exclusive main commit
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_BRANCH" = develop
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          git merge-base --is-ancestor origin/main HEAD
          echo 'MAIN_ANCESTRY=preserved; no force push or protection change'
