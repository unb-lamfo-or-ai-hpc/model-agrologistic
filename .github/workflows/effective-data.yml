name: Effective data contract without solver
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
  data-contract:
    needs: scope
    if: needs.scope.outputs.data_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install data and construction dependencies only
        run: |
          python -m pip install 'numpy>=2.1,<3' 'pandas>=2.2,<3' 'openpyxl>=3.1,<4' 'pyomo==6.10.1' 'pytest>=8,<10' 'ruff>=0.8,<1' 'setuptools>=77' wheel build pyyaml
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint and check renderer syntax without running the renderer
        run: |
          python -m ruff check .
          node --check scripts/render_effective_workbooks.mjs
          node --check scripts/t2/render_workbooks_v2.mjs
      - name: Test the data boundary with solver and process barriers
        run: python -B scripts/check_effective_contract.py --output "$RUNNER_TEMP/effective-contract"
      - name: Package without dependency installation or optimizer invocation
        run: |
          python -m build --no-isolation
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: effective-data-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/effective-contract
          if-no-files-found: error
