name: Post-S2 h400 closed qualification
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  h400-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Exact-head public fixtures and Bash; no solver or NPAD
        run: |
          mkdir "$RUNNER_TEMP/h400-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/h400-source"
          printf 'QUALIFIED_HEAD=%s\n' "$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/h400-source"
          python -B -I - "$RUNNER_TEMP/h400-files.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path.cwd()
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(files,sort_keys=True))
          PY
          python -B -m ruff check --no-cache .
          bash -n scripts/qualify_h400_post_s2.sh
          python -B -m pytest -p no:cacheprovider -q \
            tests/test_mvp2_h400_post_s2.py \
            tests/test_mvp2_h400_input.py tests/test_mvp2_h400_control.py \
            tests/test_mvp2_s2_p4_input_contract.py tests/test_mvp2_s2_p5_evidence.py \
            --basetemp="$RUNNER_TEMP/h400-tests" --junitxml="$RUNNER_TEMP/h400-tests.xml"
          python -B -I - "$RUNNER_TEMP/h400-tests.xml" "$RUNNER_TEMP/h400-files.json" <<'PY'
          import hashlib,json,pathlib,sys,xml.etree.ElementTree as ET
          cases=ET.parse(sys.argv[1]).getroot().findall('.//testcase')
          assert len(cases)==214
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          root=pathlib.Path.cwd()
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert files==json.loads(pathlib.Path(sys.argv[2]).read_text()),'Post-test source drift'
          print('H400_CLOSED_QUALIFICATION=214 passed; SOURCE_CLOSED; NO_NPAD_OR_LICENSED_SOLVE')
          PY
