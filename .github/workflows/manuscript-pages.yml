name: Publish reviewed manuscript
on:
  workflow_dispatch:
    inputs:
      publish_reviewed_snapshot:
        description: Publish the hash-approved coauthor-review snapshot (not journal submission)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: manuscript-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.MANUSCRIPT_PAGES_ENABLED == 'true' && inputs.publish_reviewed_snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_manuscript.py --publication
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Install declared document dependencies
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin poppler-utils
          tex_bin="$HOME/.TinyTeX/bin/x86_64-linux"
          test -x "$tex_bin/tlmgr"
          echo "$tex_bin" >> "$GITHUB_PATH"
          "$tex_bin/tlmgr" update --self
          "$tex_bin/tlmgr" install orcidlink pgf caption bookmark xurl footnotehyper microtype lm amsfonts geometry natbib etoolbox booktabs tools babel-english parskip xcolor pdfpages eso-pic
      - run: python scripts/build_manuscript_comparison.py --check
      - run: python -m scripts.build_scalar_manuscript --check
      - run: python -m scripts.build_wd_manuscript --check
      - run: python -m scripts.build_s6a_assets
      - run: quarto render manuscript
      - run: quarto render manuscript/supplement
      - run: python scripts/assemble_manuscript_outputs.py
      - run: python scripts/check_manuscript.py --rendered
      - run: python scripts/package_manuscript.py --output manuscript/_manuscript/coauthor-latex.zip
      - uses: actions/upload-artifact@v4
        with:
          name: published-s6a-review-package
          path: manuscript/_manuscript/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/_manuscript/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
