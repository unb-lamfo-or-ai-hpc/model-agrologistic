name: Publish reviewed manuscript
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manuscript-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.MANUSCRIPT_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_manuscript.py --publication
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Install declared document dependencies
        run: tlmgr install orcidlink pgf caption bookmark xurl footnotehyper microtype lmodern amsfonts geometry natbib etoolbox booktabs tools babel-english parskip xcolor
      - run: quarto render manuscript
      - run: quarto render manuscript/supplement
      - run: python scripts/assemble_manuscript_outputs.py
      - run: python scripts/check_manuscript.py --rendered
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manuscript/_manuscript/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
