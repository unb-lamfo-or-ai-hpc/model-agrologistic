# Working renders are local. Manual cloud rendering requires a new explicit mandate.
# Final publication is handled separately after the approved main integration.
name: Manuscript draft
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Install declared document dependencies
        run: |
          python -m pip install -e '.[dev]'
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin poppler-utils
          tex_bin="$HOME/.TinyTeX/bin/x86_64-linux"
          test -x "$tex_bin/tlmgr"
          echo "$tex_bin" >> "$GITHUB_PATH"
          "$tex_bin/tlmgr" update --self
          "$tex_bin/tlmgr" install orcidlink pgf caption bookmark xurl footnotehyper microtype lm amsfonts geometry natbib etoolbox booktabs tools babel-english parskip xcolor pdfpages eso-pic
      - run: python scripts/build_manuscript_comparison.py --check
      - run: python -m scripts.build_scalar_manuscript --check
      - run: python -m scripts.build_wd_manuscript --check
      - run: python -m scripts.build_s6a_assets
      - run: python -m pytest tests/test_geographic_visualization.py tests/test_manuscript.py tests/test_manuscript_package.py -q
      - run: python scripts/check_manuscript.py
      - run: quarto render manuscript
      - run: quarto render manuscript/supplement
      - run: python scripts/assemble_manuscript_outputs.py
      - run: python scripts/check_manuscript_appendix_inputs.py --output manuscript/_manuscript/appendix-reader-audit.json
      - run: python scripts/check_manuscript.py --rendered
      - run: python scripts/package_manuscript.py --output manuscript/_manuscript/coauthor-latex.zip
      - run: python scripts/render_manuscript_review.py --output manuscript/_manuscript/render-review.html
