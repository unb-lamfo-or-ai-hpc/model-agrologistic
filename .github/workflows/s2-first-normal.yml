name: S2 first-normal offline qualification
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  normal-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Syntax without executing the NPAD driver
        run: |
          bash -n scripts/npad_s2_first_normal.sh
          bash -n scripts/npad_s2_normal_recovery.sh
          bash -n scripts/npad_s2_compute_normal.sh
          bash -n scripts/npad_s2_normal_successor.sh
          bash -n scripts/npad_s2_allocation_diagnostic.sh
      - name: Clean source before the exact driver-selected regression
        run: |
          S2_ROOT=$(mktemp -d "$RUNNER_TEMP/s2-regression-XXXXXXXX")
          mkdir "$S2_ROOT/source"
          git archive HEAD | tar -x -C "$S2_ROOT/source"
          echo "S2_ROOT=$S2_ROOT" >> "$GITHUB_ENV"
          python -B -I - "$S2_ROOT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          base = pathlib.Path(sys.argv[1])
          root = base / 'source'
          sys.path.insert(0, str(root))
          from scripts import mvp2_s2_compute_identity as identity
          files = {
              p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in root.rglob('*') if p.is_file()
          }
          identity.inspect_tree(root, files)
          (base / 'source-files.json').write_text(json.dumps(files), encoding='utf-8')
          print('PRE_REGRESSION_PHYSICAL_SOURCE=VERIFIED')
          PY
      - name: All eleven suites once, products outside the source, no scheduler effects
        run: |
          cd "$S2_ROOT/source"
          python -B -I -m pytest -p no:cacheprovider \
            tests/test_mvp2_s2_first_normal.py tests/test_mvp2_s2_normal_diagnostics.py \
            tests/test_mvp2_s2_normal_recovery.py tests/test_mvp2_s2_batch_adapter.py \
            tests/test_mvp2_s2_operational.py tests/test_mvp2_s2_compute_identity.py \
            tests/test_mvp2_s2_compute_integration.py tests/test_mvp2_s2_compute_normal.py \
            tests/test_mvp2_s2_listpids_compatibility.py \
            tests/test_mvp2_s2_normal_successor.py tests/test_mvp2_s2_normal_predecessor.py \
            -q --basetemp="$S2_ROOT/tests" --junitxml="$S2_ROOT/regression.xml"
      - name: Exact case and skip policy plus post-regression physical closure
        run: |
          python -B -I - "$S2_ROOT" <<'PY'
          import json
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          base = pathlib.Path(sys.argv[1])
          cases = ET.parse(base / 'regression.xml').getroot().findall('.//testcase')
          assert len(cases) == 597
          assert not any(x.find(k) is not None for x in cases for k in ('failure', 'error'))
          skips = [x for x in cases if x.find('skipped') is not None]
          assert len(skips) == 2 and {x.get('name') for x in skips} == {
              'test_probe_cli_platform_failure_still_packages_negative_evidence',
              'test_real_non_linux_start_has_no_effect',
          }
          root = base / 'source'
          sys.path.insert(0, str(root))
          from scripts import mvp2_s2_compute_identity as identity
          files = json.loads((base / 'source-files.json').read_text(encoding='utf-8'))
          identity.inspect_tree(root, files)
          print('595 passed; two intentional platform skips; POST_REGRESSION_PHYSICAL_SOURCE=VERIFIED')
          PY
      - name: Allocation diagnostic lifecycle (no scheduler effects)
        run: |
          cd "$S2_ROOT/source"
          python -B -I -m pytest -p no:cacheprovider tests/test_mvp2_s2_allocation_diagnostic.py \
            -q --basetemp="$S2_ROOT/diagnostic-tests" --junitxml="$S2_ROOT/diagnostic.xml"
          python -B -I - "$S2_ROOT" <<'PY'
          import json
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          base = pathlib.Path(sys.argv[1])
          cases = ET.parse(base / 'diagnostic.xml').getroot().findall('.//testcase')
          assert len(cases) == 59 and not any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped'))
          sys.path.insert(0, str(base / 'source'))
          from scripts import mvp2_s2_compute_identity as identity
          identity.inspect_tree(base / 'source', json.loads((base / 'source-files.json').read_text()))
          print('59 diagnostic passes; zero skips; physical source closure preserved')
          PY
      - name: Observed NPAD node identity regression (no scheduler effects)
        run: |
          cd "$S2_ROOT/source"
          python -B -I -m pytest -p no:cacheprovider tests/test_mvp2_s2_node_identity.py \
            -q --basetemp="$S2_ROOT/node-tests" --junitxml="$S2_ROOT/node.xml"
          python -B -I - "$S2_ROOT" <<'PY'
          import json
          import pathlib
          import sys
          import xml.etree.ElementTree as ET
          base = pathlib.Path(sys.argv[1])
          cases = ET.parse(base / 'node.xml').getroot().findall('.//testcase')
          assert len(cases) == 44 and not any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped'))
          sys.path.insert(0, str(base / 'source'))
          from scripts import mvp2_s2_compute_identity as identity
          identity.inspect_tree(base / 'source', json.loads((base / 'source-files.json').read_text()))
          print('44 node identity passes; zero skips; physical source closure preserved')
          PY
      - name: Real clean login source seal (local Git only)
        run: |
          git -c core.autocrlf=false clone --no-checkout . "$S2_ROOT/login-source"
          printf '%s\n' '/manuscript/comparison_provenance.json -text' '/manuscript/figures/runtime_memory_comparison.pdf -text' > "$S2_ROOT/login-source/.git/info/attributes"
          git -C "$S2_ROOT/login-source" -c core.autocrlf=false checkout --detach "$GITHUB_SHA"
          python -B -I - "$S2_ROOT/login-source" "$GITHUB_SHA" <<'PY'
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          sys.path.insert(0, str(root))
          from scripts import mvp2_s2_allocation_diagnostic as diagnostic
          files = diagnostic.source_files(root, sys.argv[2])
          print(f'DIAGNOSTIC_LOGIN_RAW_HEAD={len(files)} files; no Slurm calls')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-first-normal-offline-regression
          path: |
            ${{ env.S2_ROOT }}/regression.xml
            ${{ env.S2_ROOT }}/source-files.json
            ${{ env.S2_ROOT }}/diagnostic.xml
            ${{ env.S2_ROOT }}/node.xml
