name: S2 first-normal offline qualification
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  normal-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Syntax without executing the NPAD driver
        run: |
          bash -n scripts/npad_s2_first_normal.sh
          bash -n scripts/npad_s2_normal_recovery.sh
      - name: Fake-effect and local portable qualification only
        run: |
          python -m pytest -p no:cacheprovider tests/test_mvp2_s2_first_normal.py tests/test_mvp2_s2_batch_adapter.py tests/test_mvp2_s2_operational.py -q --junitxml=/tmp/s2-normal-regression.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/s2-normal-regression.xml').getroot().findall('.//testcase')
          assert len(cases) == 243
          assert not any(x.find('failure') is not None or x.find('error') is not None for x in cases)
          skips = [x for x in cases if x.find('skipped') is not None]
          assert len(skips) == 2 and {x.get('name') for x in skips} == {
              'test_probe_cli_platform_failure_still_packages_negative_evidence',
              'test_real_non_linux_start_has_no_effect',
          }
          PY
      - name: Bounded diagnostics and historical v1 replay, no scheduler effects
        run: python -m pytest -p no:cacheprovider tests/test_mvp2_s2_normal_diagnostics.py -q --junitxml=/tmp/s2-normal-diagnostics.xml
      - name: Separate normal recovery lineage and one-shot effects, offline only
        run: |
          python -m pytest -p no:cacheprovider tests/test_mvp2_s2_normal_recovery.py -q --junitxml=/tmp/s2-normal-recovery.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/s2-normal-recovery.xml').getroot().findall('.//testcase')
          assert len(cases) == 66
          assert not any(x.find(k) is not None for x in cases for k in ('failure', 'error', 'skipped'))
          PY
      - name: Closed compute identity and early-entry failures, no scheduler effects
        run: python -m pytest -p no:cacheprovider tests/test_mvp2_s2_compute_identity.py -q --junitxml=/tmp/s2-compute-identity.xml
      - name: Closed batch-worker-history integration and versioned collection
        run: |
          python -m pytest -p no:cacheprovider tests/test_mvp2_s2_compute_integration.py -q --junitxml=/tmp/s2-compute-integration.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('/tmp/s2-compute-integration.xml').getroot().findall('.//testcase')
          assert len(cases) == 55
          assert not any(x.find(k) is not None for x in cases for k in ('failure', 'error', 'skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2-first-normal-offline-regression
          path: |
            /tmp/s2-normal-regression.xml
            /tmp/s2-normal-diagnostics.xml
            /tmp/s2-normal-recovery.xml
            /tmp/s2-compute-identity.xml
            /tmp/s2-compute-integration.xml
