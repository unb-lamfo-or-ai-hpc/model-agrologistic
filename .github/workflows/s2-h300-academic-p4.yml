name: S2 P4 closed academic preparation

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  preparation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Closed P4 preparation and relevant native/partial controls
        run: |
          python -B -m ruff check --no-cache scripts/mvp2_s2_h300_academic.py tests/test_mvp2_s2_h300_academic.py
          python -B -m pytest -p no:cacheprovider tests/test_mvp2_s2_h300_academic.py tests/test_mvp2_h300_thread_contract.py tests/test_mvp2_h300_partial.py tests/test_mvp2_h300_native_worker.py tests/test_mvp2_h300_controls.py tests/test_mvp2_s2_academic.py tests/test_mvp2_s2_academic_recovery.py -q --basetemp="$RUNNER_TEMP/p4-preparation" --junitxml="$RUNNER_TEMP/p4-preparation.xml"
          python -B -I - "$RUNNER_TEMP/p4-preparation.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall('.//testcase')
          assert len(cases) >= 278
          assert not any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped'))
          print(f'P4_CLOSED_PREPARATION={len(cases)} passed; NO_NPAD_EFFECTS')
          PY
