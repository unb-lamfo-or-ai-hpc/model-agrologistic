name: S2 P4 complete closed academic package

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Complete closed P4 on pristine exact-head source
        run: |
          mkdir "$RUNNER_TEMP/p4-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/p4-source"
          printf 'QUALIFIED_HEAD=%s\n' "$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/p4-source"
          python -B -I - "$RUNNER_TEMP/p4-inventory.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path.cwd()
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(files,sort_keys=True))
          print('RAW_GIT_ARCHIVE_FILES='+str(len(files)))
          PY
          python -B -m ruff check --no-cache scripts/mvp2_s2_h300_academic.py scripts/mvp2_s2_h300_products.py scripts/mvp2_s2_h300_runtime.py tests/test_mvp2_s2_h300_academic.py tests/test_mvp2_s2_h300_runtime.py
          bash -n scripts/npad_s2_h300_academic.sh
          python -B -m pytest -p no:cacheprovider tests/test_mvp2_s2_h300_academic.py tests/test_mvp2_s2_h300_runtime.py tests/test_mvp2_h300_thread_contract.py tests/test_mvp2_h300_partial.py tests/test_mvp2_h300_native_worker.py tests/test_mvp2_h300_controls.py tests/test_mvp2_s2_academic.py tests/test_mvp2_s2_academic_recovery.py -q --basetemp="$RUNNER_TEMP/p4-preparation" --junitxml="$RUNNER_TEMP/p4-preparation.xml"
          python -B -I - "$RUNNER_TEMP/p4-preparation.xml" <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = ET.parse(sys.argv[1]).getroot().findall('.//testcase')
          assert len(cases) == 463
          assert not any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped'))
          print(f'P4_COMPLETE_CLOSED_PACKAGE={len(cases)} passed; NO_NPAD_EFFECTS')
          PY
          python -B -I - "$RUNNER_TEMP/p4-inventory.json" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path.cwd()
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert files==json.loads(pathlib.Path(sys.argv[1]).read_text()),'Post-regression source drift or extra files'
          print('POST_REGRESSION_RAW_SOURCE_CLOSURE=VERIFIED')
          PY
