name: S2 P4 diagnostic and terminal-handoff software gate
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Exact-head 732-case closed package with physical source closure
        run: |
          mkdir "$RUNNER_TEMP/diagnostic-source"
          git archive HEAD | tar -xf - -C "$RUNNER_TEMP/diagnostic-source"
          printf 'QUALIFIED_HEAD=%s\n' "$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/diagnostic-source"
          python -B -I - "$RUNNER_TEMP/diagnostic-files.json" <<'PY'
          import hashlib,json,pathlib,sys
          files={p.relative_to(pathlib.Path.cwd()).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path.cwd().rglob('*') if p.is_file()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(files,sort_keys=True))
          PY
          python -B -m ruff check --no-cache scripts/mvp2_s2_p4_diagnostics.py tests/test_mvp2_s2_p4_diagnostics.py
          python -B -m pytest -p no:cacheprovider tests/test_mvp2_s2_p4_diagnostics.py tests/test_mvp2_s2_p4_release.py tests/test_mvp2_s2_p4_metadata_identity.py tests/test_mvp2_s2_p4_input_contract.py tests/test_mvp2_s2_p4_observation.py tests/test_mvp2_s2_p4_admission.py tests/test_mvp2_s2_h300_academic.py tests/test_mvp2_s2_h300_runtime.py tests/test_mvp2_h300_thread_contract.py tests/test_mvp2_h300_partial.py tests/test_mvp2_h300_native_worker.py tests/test_mvp2_h300_controls.py tests/test_mvp2_s2_academic.py tests/test_mvp2_s2_academic_recovery.py -q --basetemp="$RUNNER_TEMP/diagnostic-tests" --junitxml="$RUNNER_TEMP/diagnostic-tests.xml"
          python -B -I - "$RUNNER_TEMP/diagnostic-tests.xml" "$RUNNER_TEMP/diagnostic-files.json" <<'PY'
          import hashlib,json,pathlib,sys,xml.etree.ElementTree as ET
          cases=ET.parse(sys.argv[1]).getroot().findall('.//testcase')
          assert len(cases)==732
          assert not any(c.find(k) is not None for c in cases for k in ('failure','error','skipped'))
          files={p.relative_to(pathlib.Path.cwd()).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path.cwd().rglob('*') if p.is_file()}
          assert files==json.loads(pathlib.Path(sys.argv[2]).read_text()),'Post-test source drift'
          print('P4_DIAGNOSTICS_SOFTWARE=732 passed; SOURCE_CLOSED; NO_LICENSE_SLURM_OR_H300')
          PY
