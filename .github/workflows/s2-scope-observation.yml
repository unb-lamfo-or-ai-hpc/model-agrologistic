name: S2 scope observation offline qualification
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  scope-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Bash syntax and clean exported source
        run: |
          bash -n scripts/npad_s2_scope_diagnostic.sh
          SCOPE_ROOT=$(mktemp -d "$RUNNER_TEMP/s2-scope-XXXXXXXX")
          mkdir "$SCOPE_ROOT/source"
          git archive HEAD | tar -x -C "$SCOPE_ROOT/source"
          echo "SCOPE_ROOT=$SCOPE_ROOT" >> "$GITHUB_ENV"
          python -B -I - "$SCOPE_ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          base = pathlib.Path(sys.argv[1])
          root = base / 'source'
          files = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in root.rglob('*') if p.is_file()}
          (base / 'files.json').write_text(json.dumps(files))
          PY
      - name: Exact offline diagnostic regression and physical closure
        run: |
          cd "$SCOPE_ROOT/source"
          python -B -m ruff check --no-cache scripts/mvp2_s2_scope_diagnostic.py tests/test_mvp2_s2_scope_diagnostic.py
          python -B -m pytest -p no:cacheprovider tests/test_mvp2_s2_scope_diagnostic.py -q --basetemp="$SCOPE_ROOT/tests" --junitxml="$SCOPE_ROOT/regression.xml"
          python -B -I - "$SCOPE_ROOT" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          base = pathlib.Path(sys.argv[1])
          cases = ET.parse(base / 'regression.xml').getroot().findall('.//testcase')
          assert len(cases) == 47
          assert not any(c.find(k) is not None for c in cases for k in ('failure', 'error', 'skipped'))
          sys.path.insert(0, str(base / 'source'))
          from scripts import mvp2_s2_allocation_diagnostic as d
          d.verify_tree(base / 'source', json.loads((base / 'files.json').read_text()))
          print('47 passed; zero failures/errors/skips; physical source closure verified; NO_NPAD_EFFECTS')
          PY
