name: SCIP analytical qualification
on:
  pull_request:
  push:
    branches: [research/scip-qualification]
permissions:
  contents: read
jobs:
  native-scip:
    runs-on: ubuntu-latest
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,scip]' 'pyscipopt==6.2.1'
      - run: python -m pytest tests/test_scip_backend.py tests/test_scalar_contract.py -p no:cacheprovider --junitxml=/tmp/scip-qualification/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scip-analytical-qualification
          path: /tmp/scip-qualification
