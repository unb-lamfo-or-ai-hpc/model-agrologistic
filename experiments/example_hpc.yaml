version: 1
output_dir: ../data/results/hpc
continue_on_error: true

defaults:
  max_estimated_variables: 2000000
  solver:
    backend: gurobipy
    solver_name: gurobi
    mip_gap: 0.01
    time_limit: 300
    threads: 0
    seed: 0
    tee: true
    compute_iis: true
    iis_max_items: 200
  model:
    use_warehouse_transshipment: true
    use_direct_origin_customer: true
    route_filter_strategy: top_k
    route_top_k: 10
    days_per_period: 30
    allow_capacity_expansion: true
    allow_bulkification: true

experiments:
  - name: deterministic_baseline
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      mode: det
    loader:
      include_transshipment_routes: true
      include_direct_origin_customer_routes: true
    metadata:
      family: baseline

  - name: stochastic_nine_scenarios_rp
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    max_estimated_variables: 6000000
    solver:
      time_limit: 7200
      threads: 16
      solver_options:
        SoftMemLimit: 176
        NumericFocus: 1
    model:
      mode: sto
    loader:
      include_transshipment_routes: true
      include_direct_origin_customer_routes: true
      include_stochastic_scenarios: true
      scenario_generation_mode: cartesian
      stochastic_supply_levels: [baixo, base, alto]
      stochastic_demand_levels: [baixo, base, alto]
    calculate_evpi_vss: false
    metadata:
      family: stochastic
      phase: rp_pilot

  - name: stochastic_nine_scenarios_evpi_vss
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    max_estimated_variables: 6000000
    solver:
      time_limit: 7200
      threads: 16
      solver_options:
        SoftMemLimit: 176
        NumericFocus: 1
    model:
      mode: sto
    loader:
      include_transshipment_routes: true
      include_direct_origin_customer_routes: true
      include_stochastic_scenarios: true
      scenario_generation_mode: cartesian
      stochastic_supply_levels: [baixo, base, alto]
      stochastic_demand_levels: [baixo, base, alto]
    calculate_evpi_vss: true
    resume_evpi_vss: true
    metadata:
      family: stochastic
      phase: evpi_vss_after_rp_validation

