version: 1
output_dir: ../data/results/hpc/route_filter_sensitivity
continue_on_error: true

defaults:
  max_estimated_variables: 2000000
  loader:
    include_transshipment_routes: true
  solver:
    backend: gurobipy
    solver_name: gurobi
    mip_gap: 0.01
    time_limit: 300
    threads: 0
    seed: 0
    tee: true
    compute_iis: true
    iis_max_items: 200
  model:
    mode: det
    use_warehouse_transshipment: true
    allow_capacity_expansion: true
    allow_bulkification: true

experiments:
  - name: deterministic_top_k_3
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      route_filter_strategy: top_k
      route_top_k: 3
    metadata:
      family: route_filter_sensitivity
      strategy: top_k
      route_top_k: 3

  - name: deterministic_top_k_5
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      route_filter_strategy: top_k
      route_top_k: 5
    metadata:
      family: route_filter_sensitivity
      strategy: top_k
      route_top_k: 5

  - name: deterministic_top_k_10
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      route_filter_strategy: top_k
      route_top_k: 10
    metadata:
      family: route_filter_sensitivity
      strategy: top_k
      route_top_k: 10

  - name: deterministic_pareto_05
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      route_filter_strategy: pareto
      pareto_fraction: 0.05
    metadata:
      family: route_filter_sensitivity
      strategy: pareto
      pareto_fraction: 0.05

