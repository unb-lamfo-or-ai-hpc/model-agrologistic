version: 1
output_dir: ../data/results/hpc/v020_policy_mvp
continue_on_error: true

defaults:
  max_estimated_variables: 25000000
  solver:
    backend: gurobipy
    solver_name: gurobi
    mip_gap: 0.01
    time_limit: 3600
    threads: 16
    seed: 42
    tee: true
    compute_iis: true
    iis_max_items: 200
    solver_options:
      SoftMemLimit: 56
      NumericFocus: 1
  model:
    objective_policy: penalty
    interhub_factor: 1.0
    use_warehouse_transshipment: true
    route_filter_strategy: thesis_pareto
    candidate_capacity_mode: scalable
    terminal_inventory_policy: free
    capacity_coupling_policy: daily_factors
    days_per_period: 30
    allow_capacity_expansion: true
    allow_bulkification: true
    separate_emergency_capacity_slacks: true
  loader:
    include_export_routes: true
    include_transshipment_routes: true
    include_direct_origin_customer_routes: true
    candidate_cost_policy: variable_from_total
    penalty_policy: thesis_dynamic

experiments:
  - name: policy_det_p15_warehouse
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      mode: det
      pareto_fraction: 0.15
      use_direct_origin_customer: false
    metadata:
      evidence_profile: policy_mvp_v020
      scenario_design: deterministic
      route_policy: grouped_nearest_edge_fraction
      route_fraction: 0.15
      direct_arcs: false
      warehouse_population: canonical_gold_workbook

  - name: policy_det_p15_direct
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      mode: det
      pareto_fraction: 0.15
      use_direct_origin_customer: true
    metadata:
      evidence_profile: policy_mvp_v020
      scenario_design: deterministic
      route_policy: grouped_nearest_edge_fraction
      route_fraction: 0.15
      direct_arcs: true
      warehouse_population: canonical_gold_workbook

  - name: policy_det_p20_warehouse
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
