version: 1
output_dir: ../data/results/hpc/v020_policy_mvp
continue_on_error: false

defaults:
  max_estimated_variables: 6000000
  solver:
    backend: gurobipy
    solver_name: gurobi
    mip_gap: 0.01
    time_limit: 7200
    threads: 16
    seed: 42
    tee: true
    compute_iis: true
    iis_max_items: 200
    solver_options:
      SoftMemLimit: 56
      NumericFocus: 1
  model:
    objective_policy: penalty
    interhub_factor: 1.0
    use_warehouse_transshipment: true
    use_direct_origin_customer: true
    route_filter_strategy: none
    candidate_capacity_mode: scalable
    terminal_inventory_policy: free
    capacity_coupling_policy: daily_factors
    days_per_period: 30
    allow_capacity_expansion: true
    allow_bulkification: true
    separate_emergency_capacity_slacks: true
  loader:
    include_export_routes: true
    include_transshipment_routes: true
    include_direct_origin_customer_routes: true
    candidate_cost_policy: variable_from_total
    penalty_policy: thesis_dynamic

experiments:
  - name: policy_mvp_full_network_det
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      mode: det
    metadata:
      evidence_profile: policy_mvp
      comparison_scope: full_network_deterministic_extension
      route_policy: complete_network

  - name: policy_mvp_full_network_sto_9
    workbook: ../data/templates/model_agrologistic_padrao_ouro.xlsx
    model:
      mode: sto
    loader:
      include_stochastic_scenarios: true
      scenario_generation_mode: cartesian
      stochastic_supply_levels: [baixo, base, alto]
      stochastic_demand_levels: [baixo, base, alto]
    calculate_evpi_vss: true
    resume_evpi_vss: true
    metadata:
      evidence_profile: policy_mvp
      comparison_scope: full_network_nine_scenario_extension
      scenario_design: full_factorial_three_by_three
      probability_policy: equal_experimental_weights
      route_policy: complete_network
