version: 1
output_dir: ../data/results/validation/pr25-final/policy-nine-memory128
continue_on_error: false

# Resource-only retry of the warehouse run stopped by the 56 GB soft limit.
defaults:
  max_estimated_variables: 25000000
  solver:
    backend: gurobipy
    solver_name: gurobi
    mip_gap: 0.01
    time_limit: 14400
    threads: 16
    seed: 42
    tee: true
    compute_iis: true
    iis_max_items: 200
    solver_options:
      SoftMemLimit: 128
      NumericFocus: 1
  model:
    mode: sto
    objective_policy: lexicographic
    interhub_factor: 1.0
    use_warehouse_transshipment: true
    route_filter_strategy: connectivity_preserving_pareto
    connectivity_export_policy: one_sink_per_product
    candidate_capacity_mode: scalable
    terminal_inventory_policy: free
    capacity_coupling_policy: daily_factors
    days_per_period: 30
    allow_capacity_expansion: true
    allow_bulkification: true
    separate_emergency_capacity_slacks: true
    pareto_fraction: 0.20
  loader:
    compute_haversine_distances: false
    use_workbook_distances: true
    required_distance_source: osrm_primary
    include_export_routes: true
    include_transshipment_routes: true
    include_direct_origin_customer_routes: true
    candidate_cost_policy: variable_from_total
    penalty_policy: thesis_dynamic
    include_stochastic_scenarios: true
    scenario_generation_mode: cartesian
    stochastic_supply_levels: [baixo, base, alto]
    stochastic_demand_levels: [baixo, base, alto]

experiments:
  - name: policy_sto9_p20_warehouse_t14400_mem128
    workbook: ../data/processed/policy_population_v020_osrm/warehouses_215/model_input.xlsx
    model:
      use_direct_origin_customer: false
    metadata:
      evidence_profile: policy_mvp_v020
      scenario_design: cartesian_nine_scenarios
      route_policy: connectivity_preserving_grouped_edge_fraction
      route_fraction: 0.20
      direct_arcs: false
      warehouse_population: warehouses_215_osrm_authoritative
      retry_of: policy_sto9_p20_warehouse_t14400
      retry_reason: gurobi_soft_memory_limit_56_gb
      prior_slurm_job_id: "2088823_0"
      soft_memory_limit_gb: 128
      requested_memory_gib: 192
      time_limit_seconds: 14400
