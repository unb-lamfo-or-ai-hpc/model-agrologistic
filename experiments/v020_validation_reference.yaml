schema_version: 1
scope: >-
  Bounded alpha=0.8 thesis-method comparison and 215-warehouse OSRM service-first
  policy references at 20-percent retained arcs. Not numerical replication of
  all published thesis tables and not the full scalability campaign.
campaigns:
  - profile: thesis_method_with_separate_slacks
    manifest: experiments/v020_thesis_compatible.yaml
    indices: [0, 1, 6, 7]
    output_dir: data/results/validation/pr25-final/thesis
  - profile: policy_service_first_deterministic
    manifest: experiments/v020_policy_service_feasibility.yaml
    indices: [0, 2]
    output_dir: data/results/validation/pr25-final/service
  - profile: policy_service_first_stochastic
    manifest: experiments/v020_policy_mvp.yaml
    indices: [8, 9, 14, 15]
    output_dir: data/results/validation/pr25-final/policy
