project:
  type: default
  output-dir: _supplement
  render:
    - index.qmd
metadata-files:
  - ../authors.json
lang: en
execute:
  enabled: false
format:
  html:
    embed-resources: true
    number-sections: false
  pdf:
    documentclass: article
    fontsize: 11pt
    papersize: a4
    pdf-engine: pdflatex
    latex-auto-install: false
    keep-tex: true
    number-sections: false
    cite-method: citeproc
    geometry:
      - margin=25mm
    include-in-header:
      text: |
        \usepackage{pdfpages}
        \usepackage{float}
        \usepackage{xurl}
        \usepackage{caption}
        \captionsetup[table]{labelformat=empty}
        \captionsetup[figure]{labelformat=empty}
