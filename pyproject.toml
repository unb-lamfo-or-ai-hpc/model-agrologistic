[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"


[project]
name = "model-agrologistic"
version = "0.2.0.dev0"
description = "TRL 6 research demonstrator for deterministic and stochastic agricultural logistics optimization."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

authors = [
    { name = "cvictorr2508", email = "cvictorr2508@gmail.com" }
]

maintainers = [
    { name = "cvictorr2508", email = "cvictorr2508@gmail.com" }
]

keywords = [
    "agricultural-logistics",
    "mixed-integer-linear-programming",
    "facility-location",
    "gurobi",
    "hpc",
    "operations-research",
    "stochastic-programming"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    # Numerical and tabular data processing used by the canonical data model.
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",

    # Canonical Excel workbook ingestion and generation.
    "openpyxl>=3.1,<4",

    # Primary and validated optimization backend for the TRL 6 demonstrator.
    "gurobipy>=13.0.2,<14",

    # Versioned experiment manifests.
    "pyyaml>=6.0,<7",

    # Optional OSRM distance client retained by the repository.
    "requests>=2.32,<3",
]


[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "matplotlib>=3.9,<4",
    "mypy>=1.13,<2",
    "pytest>=8.0,<10",
    "ruff>=0.8,<1",
    "seaborn>=0.13,<1",
    "setuptools>=77",
    "wheel>=0.45,<1",
]

visualization = [
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
]

gurobi = [
    "gurobipy>=13.0.2,<14",
]

pyomo = [
    "pyomo>=6.10,<7",
]

scip = [
    "pyscipopt>=6.2,<7",
]

hpc = [
    "gurobipy>=13.0.2,<14",
    "pyyaml>=6.0,<7",
]

forecasting = [
    "importlib-resources>=6,<7",
    "prophet>=1.1,<2",
    "statsmodels>=0.14,<1",
    "torch>=2.8,<3",
    "xgboost>=2.1,<4",
]

all = [
    "build>=1.2,<2",
    "gurobipy>=13.0.2,<14",
    "importlib-resources>=6,<7",
    "matplotlib>=3.9,<4",
    "mypy>=1.13,<2",
    "pyomo>=6.10,<7",
    "pyscipopt>=6.2,<7",
    "pytest>=8.0,<10",
    "pyyaml>=6.0,<7",
    "prophet>=1.1,<2",
    "ruff>=0.8,<1",
    "seaborn>=0.13,<1",
    "setuptools>=77",
    "statsmodels>=0.14,<1",
    "torch>=2.8,<3",
    "wheel>=0.45,<1",
    "xgboost>=2.1,<4",
]


[project.urls]
Homepage = "https://github.com/unb-lamfo-or-ai-hpc/model-agrologistic"
Documentation = "https://github.com/unb-lamfo-or-ai-hpc/model-agrologistic/tree/main/docs"
Repository = "https://github.com/unb-lamfo-or-ai-hpc/model-agrologistic"
Issues = "https://github.com/unb-lamfo-or-ai-hpc/model-agrologistic/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
exclude = [
    "tests",
    "tests.*",
    "benchmark",
    "benchmark.*",
    "scripts",
    "scripts.*",
    "data",
    "data.*",
    "docs",
    "docs.*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    # Pre-MVP exploratory and interface-support modules preserved for provenance.
    "scripts/benchmark_model.py",
    "scripts/inspect_excel_instance.py",
    "src/logic/i18n.py",
    "src/logic/osrm.py",
    "src/logic/prediction.py",
    "src/logic/utils.py",
    "tests/test_haversine.py",
    "tests/test_osrm.py",
]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []


[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false
