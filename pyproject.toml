[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[project]
name = "model-agrologistic"
version = "0.0.1"
authors = [
    {name = "cvictorr2508email="cvictorr2508@gmail.com"}
]
maintainers = [
    {name = "cvictorr2508email="cvictorr2508@gmail.com"}
]
description = "SiloDSS"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = "~=3.10.0"
dependencies = [
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "lxml==6.0.2",
    "xlrd==2.0.2",
    "requests==2.32.5",
    "pyomo==6.10.0",
    "psutil==7.2.2",
    "statsmodels==0.14.4",
    "prophet==1.1.6",
    "xgboost==2.1.3",
    "scikit-learn==1.6.1",
    "torch==2.9.0",
    "gurobipy==12.0.3",
    "numpy",
    "scipy",
    "requests",
    "torch",
    "networkx"
]

[project.scripts]
silodss-run = "src.__main__:main"